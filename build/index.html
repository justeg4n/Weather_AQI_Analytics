                                                                    <div className="p-3 text-slate-400">No available features</div>
                                                                )}
                                                            </div>
                                                        )}

                                                    </div>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>

                    <div className="max-w-4xl mx-auto space-y-8">
                        <div className="bg-slate-800/50 backdrop-blur-sm rounded-3xl p-6 border border-slate-700/50">
                            <div className="space-y-6">
                                <div className="flex items-center gap-3 mb-4">
                                    <BrainIcon />
                                    <h3 className="text-xl font-semibold text-white">Train Model</h3>
                                </div>
                                <p className="text-slate-300 mb-6">
                                    Configure and train a machine learning model for weather prediction
                                </p>
                                
                                <div>
                                    <label className="block text-sm font-medium text-slate-300 mb-2">Model Type</label>
                                    <select 
                                        className="w-full p-3 bg-slate-700 border border-slate-600 rounded-lg text-white"
                                        value={selectedModel}
                                        onChange={(e) => updateTabState({ selectedModel: e.target.value })}
                                    >
                                        <option value="">Select Model</option>
                                        <option value="Linear Regression">Linear Regression</option>
                                        <option value="Random Forest">Random Forest</option>
                                        <option value="KNN">K-Nearest Neighbors</option>
                                        <option value="Gradient Boost">Gradient Boosting</option>
                                        <option value="Decision Tree">Decision Tree</option>
                                    </select>
                                </div>
                                


                                <Button 
                                    onClick={handleTrainModel} 
                                    disabled={loading} 
                                    className="w-full bg-purple-600 hover:bg-purple-700 text-white"
                                >
                                    {loading ? 'Training...' : 'Train Model'}
                                </Button>
                            </div>
                        </div>

                        <div className="bg-slate-800/50 backdrop-blur-sm rounded-3xl p-6 border border-slate-700/50">
                            <div className="space-y-4">
                                <h3 className="text-xl font-semibold text-white">Model Performance</h3>
                                <p className="text-slate-300 mb-6">
                                    View metrics and performance of your trained models
                                </p>
                                <div className="text-center py-8">
                                    <div className="text-4xl mb-4">📊</div>
                                    <p className="text-slate-400">Train a model to see performance metrics</p>
                                </div>
                            </div>
                        </div>
                    </div>
                    

                </div>
            );
        };

        // Settings Tab Component - Dark Theme
        const SettingsTab = ({ tabState, updateTabState }) => {
            const { apiSettings, loading } = tabState;
            const [settings, setSettings] = useState(apiSettings || {
                accuweather_api_key: '',
                watsonx_api_key: '',
                watsonx_assistant_id: '',
                watsonx_service_url: ''
            });
            const [showKeys, setShowKeys] = useState({});

            const handleSettingChange = (key, value) => {
                const newSettings = { ...settings, [key]: value };
                setSettings(newSettings);
                updateTabState({ apiSettings: newSettings });
            };

            const toggleShowKey = (key) => {
                setShowKeys(prev => ({ ...prev, [key]: !prev[key] }));
            };

            const handleSave = async () => {
                try {
                    updateTabState({ loading: true });
                    const response = await fetch('/update-api-settings', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(settings)
                    });
                    const data = await response.json();
                    if (data.success) {
                        alert('Settings saved successfully!');
                    } else {
                        alert(data.error);
                    }
                    updateTabState({ loading: false });
                } catch (error) {
                    console.error('Error saving settings:', error);
                    alert('Error saving settings');
                    updateTabState({ loading: false });
                }
            };

            const EyeIcon = ({ show }) => (
                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    {show ? (
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 12a3 3 0 11-6 0 3 3 0 016 0z M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                    ) : (
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L3 3m6.878 6.878L21 21" />
                    )}
                </svg>
            );

            return (
                <div className="space-y-8">
                    <div className="text-center space-y-4">
                        <h2 className="text-3xl font-bold text-white">API Settings</h2>
                        <p className="text-lg text-slate-300 max-w-2xl mx-auto">
                            Configure your API credentials for AccuWeather and Watsonx services
                        </p>
                    </div>

                    <div className="max-w-2xl mx-auto space-y-6">
                        <div className="bg-slate-800/50 backdrop-blur-sm rounded-3xl p-6 border border-slate-700/50">
                            <div className="space-y-6">
                                <div className="flex items-center gap-3 mb-4">
                                    <span className="text-2xl">🌤️</span>
                                    <h3 className="text-xl font-semibold text-white">AccuWeather API</h3>
                                </div>
                                <p className="text-slate-300 mb-6">
                                    Required for real-time weather data and forecasts
                                </p>
                                
                                <div>
                                    <label className="block text-sm font-medium text-slate-300 mb-2">API Key</label>
                                    <div className="relative">
                                        <input
                                            type={showKeys.accuweather ? "text" : "password"}
                                            className="w-full p-3 bg-slate-700 border border-slate-600 rounded-lg text-white placeholder-slate-400 pr-10"
                                            placeholder="Enter your AccuWeather API key"
                                            value={settings.accuweather_api_key}
                                            onChange={(e) => handleSettingChange('accuweather_api_key', e.target.value)}
                                        />
                                        <button
                                            type="button"
                                            className="absolute right-3 top-3 text-slate-400 hover:text-white"
                                            onClick={() => toggleShowKey('accuweather')}
                                        >
                                            <EyeIcon show={showKeys.accuweather} />
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="bg-slate-800/50 backdrop-blur-sm rounded-3xl p-6 border border-slate-700/50">
                            <div className="space-y-6">
                                <div className="flex items-center gap-3 mb-4">
                                    <span className="text-2xl">🤖</span>
                                    <h3 className="text-xl font-semibold text-white">Watsonx Assistant</h3>
                                </div>
                                <p className="text-slate-300 mb-6">
                                    Required for AI-powered weather chatbot functionality
                                </p>
                                
                                <div>
                                    <label className="block text-sm font-medium text-slate-300 mb-2">API Key</label>
                                    <div className="relative">
                                        <input
                                            type={showKeys.watsonx_api ? "text" : "password"}
                                            className="w-full p-3 bg-slate-700 border border-slate-600 rounded-lg text-white placeholder-slate-400 pr-10"
                                            placeholder="Enter your Watsonx API key"
                                            value={settings.watsonx_api_key}
                                            onChange={(e) => handleSettingChange('watsonx_api_key', e.target.value)}
                                        />
                                        <button
                                            type="button"
                                            className="absolute right-3 top-3 text-slate-400 hover:text-white"
                                            onClick={() => toggleShowKey('watsonx_api')}
                                        >
                                            <EyeIcon show={showKeys.watsonx_api} />
                                        </button>
                                    </div>
                                </div>
                                
                                <div>
                                    <label className="block text-sm font-medium text-slate-300 mb-2">Assistant ID</label>
                                    <input
                                        type="text"
                                        className="w-full p-3 bg-slate-700 border border-slate-600 rounded-lg text-white placeholder-slate-400"
                                        placeholder="Enter your Watsonx Assistant ID"
                                        value={settings.watsonx_assistant_id}
                                        onChange={(e) => handleSettingChange('watsonx_assistant_id', e.target.value)}
                                    />
                                </div>
                                
                                <div>
                                    <label className="block text-sm font-medium text-slate-300 mb-2">Service URL</label>
                                    <input
                                        type="text"
                                        className="w-full p-3 bg-slate-700 border border-slate-600 rounded-lg text-white placeholder-slate-400"
                                        placeholder="Enter your Watsonx service URL"
                                        value={settings.watsonx_service_url}
                                        onChange={(e) => handleSettingChange('watsonx_service_url', e.target.value)}
                                    />
                                </div>
                            </div>
                        </div>

                        <div className="flex justify-center">
                            <Button 
                                onClick={handleSave} 
                                disabled={loading} 
                                className="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 text-lg"
                            >
                                {loading ? 'Saving...' : 'Save Settings'}
                            </Button>
                        </div>
                    </div>
                </div>
            );
        };

        // Navigation Component
        const Navigation = ({ activeTab, onTabChange }) => (
            <div className="w-full border-b bg-white/80 backdrop-blur-sm sticky top-0 z-50">
                <div className="container mx-auto px-4 py-4">
                    <div className="flex items-center justify-between mb-4">
                        <div className="flex items-center gap-3">
                            <div className="w-8 h-8 bg-gradient-to-r from-blue-500 to-purple-600 rounded-lg flex items-center justify-center">
                                <span className="text-white text-lg">🌤️</span>
                            </div>
                            <h1 className="text-2xl font-bold bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent">
                                Weather Dashboard
                            </h1>
                        </div>
                    </div>
                    
                    <div className="flex gap-1 p-1 bg-gray-100 rounded-lg w-fit">
                        {[
                            { id: 'home', label: 'Home', icon: HomeIcon },
                            { id: 'data', label: 'Weather Data', icon: ChartIcon },
                            { id: 'forecast', label: 'Forecast', icon: BrainIcon },
                            { id: 'settings', label: 'API Settings', icon: SettingsIcon }
                        ].map(({ id, label, icon: Icon }) => (
                            <button
                                key={id}
                                onClick={() => onTabChange(id)}
                                className={cn(
                                    "flex items-center gap-2 px-4 py-2 rounded-md text-sm font-medium transition-all",
                                    activeTab === id 
                                        ? "bg-white text-gray-900 shadow-sm" 
                                        : "text-gray-600 hover:text-gray-900"
                                )}
                            >
                                <Icon />
                                <span className="hidden sm:inline">{label}</span>
                            </button>
                        ))}
                    </div>
                </div>
            </div>
        );

        // Main App Component
        const App = () => {
            const [activeTab, setActiveTab] = useState('home');
            
            // Persistent tab state
            const [tabStates, setTabStates] = useState({
                home: {
                    weather: null,
                    loading: false,
                    error: null,
                    searchLocation: 'Ho Chi Minh City'
                },
                data: {
                    analysis: null,
                    loading: false,
                    showNotebook: false
                },
                forecast: {
                    models: [],
                    loading: false,
                    selectedModel: '',
                    prediction: null,
                    uploadedDataset: null,
                    datasetColumns: null
                },
                settings: {
                    apiSettings: null,
                    loading: false
                }
            });
            
            // Update tab state helper
            const updateTabState = (tab, newState) => {
                setTabStates(prev => ({
                    ...prev,
                    [tab]: { ...prev[tab], ...newState }
                }));
            };
            

            
            // Chatbot state
            const [chatbotOpen, setChatbotOpen] = useState(false);
            const [chatMessages, setChatMessages] = useState([]);
            const [chatInput, setChatInput] = useState('');
            const [chatLoading, setChatLoading] = useState(false);
            const [chatbotConfig, setChatbotConfig] = useState(null);

            // Load chatbot configuration on mount
            useEffect(() => {
                fetch('/chatbot-config')
                    .then(res => res.json())
                    .then(config => setChatbotConfig(config))
                    .catch(err => console.error('Failed to load chatbot config:', err));
            }, []);

            // Send message to Watson Assistant
            const sendChatMessage = async () => {
                if (!chatInput.trim() || chatLoading) return;
                
                const userMessage = chatInput.trim();
                setChatInput('');
                setChatLoading(true);
                
                // Add user message to chat
                setChatMessages(prev => [...prev, { text: userMessage, sender: 'user' }]);
                
                try {
                    const response = await fetch('/api/message', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ text: userMessage })
                    });
                    
                    const data = await response.json();
                    
                    if (response.ok) {
                        // Add assistant response to chat
                        if (data && data.length > 0) {
                            const assistantText = data.map(item => item.text || '').join(' ');
                            setChatMessages(prev => [...prev, { text: assistantText, sender: 'assistant' }]);
                        } else {
                            setChatMessages(prev => [...prev, { text: 'No response received', sender: 'assistant' }]);
                        }
                    } else {
                        setChatMessages(prev => [...prev, { text: data.error || 'Error occurred', sender: 'error' }]);
                    }
                } catch (error) {
                    setChatMessages(prev => [...prev, { text: 'Connection error', sender: 'error' }]);
                } finally {
                    setChatLoading(false);
                }
            };

            // Handle enter key press
            const handleChatKeyPress = (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendChatMessage();
                }
            };



            const renderTabContent = () => {
                switch (activeTab) {
                    case 'home':
                        return <HomeTab 
                            onTabChange={setActiveTab} 
                            tabState={tabStates.home}
                            updateTabState={(newState) => updateTabState('home', newState)}
                        />;
                    case 'data':
                        return <DataTab 
                            tabState={tabStates.data}
                            updateTabState={(newState) => updateTabState('data', newState)}
                        />;
                    case 'forecast':
                        return <ForecastTab 
                            tabState={tabStates.forecast}
                            updateTabState={(newState) => updateTabState('forecast', newState)}
                        />;
                    case 'settings':
                        return <SettingsTab 
                            tabState={tabStates.settings}
                            updateTabState={(newState) => updateTabState('settings', newState)}
                        />;
                    default:
                        return <HomeTab 
                            onTabChange={setActiveTab} 
                            tabState={tabStates.home}
                            updateTabState={(newState) => updateTabState('home', newState)}
                        />;
                }
            };

            const CloudIcon = () => (
                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.002 4.002 0 003 15z" />
                </svg>
            );

            return (
                <div className="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 text-white relative">
                    <div 
                        className="fixed inset-0 bg-cover bg-center bg-no-repeat" 
                        style={{
                            backgroundImage: 'url("src/background/moutainwithsky_1751655719754.jpg")',
                            zIndex: -10
                        }}
                    ></div>
                    <div className="absolute inset-0 bg-slate-900/60 backdrop-blur-sm" style={{zIndex: -5}}></div>
                    <div className="relative z-10">
                    {activeTab === 'home' ? (
                        <div className="relative">
                            {/* Tab Navigation positioned above content */}
                            <div className="flex justify-center pt-6 pb-4">
                                <div className="flex gap-1 p-1 bg-slate-800/80 backdrop-blur-sm rounded-lg border border-slate-700/50">
                                    {[
                                        { id: 'home', label: 'Home', icon: HomeIcon },
                                        { id: 'data', label: 'Data', icon: ChartIcon },
                                        { id: 'forecast', label: 'Forecast', icon: CloudIcon },
                                        { id: 'settings', label: 'Settings', icon: SettingsIcon }
                                    ].map(({ id, label, icon: Icon }) => (
                                        <button
                                            key={id}
                                            onClick={() => setActiveTab(id)}
                                            className={cn(
                                                "flex items-center gap-2 px-4 py-2 rounded-md text-sm font-medium transition-all",
                                                activeTab === id 
                                                    ? "bg-white/20 text-white shadow-sm" 
                                                    : "text-slate-300 hover:text-white hover:bg-white/10"
                                            )}
                                        >
                                            <Icon />
                                            <span className="hidden sm:inline">{label}</span>
                                        </button>
                                    ))}
                                </div>
                            </div>
                            {renderTabContent()}
                        </div>
                    ) : (
                        <div className="relative">
                            {/* Dark Theme Navigation for other tabs */}
                            <div className="flex justify-center pt-6 pb-4">
                                <div className="flex gap-1 p-1 bg-slate-800/80 backdrop-blur-sm rounded-lg border border-slate-700/50">
                                    {[
                                        { id: 'home', label: 'Home', icon: HomeIcon },
                                        { id: 'data', label: 'Data', icon: ChartIcon },
                                        { id: 'forecast', label: 'Forecast', icon: CloudIcon },
                                        { id: 'settings', label: 'Settings', icon: SettingsIcon }
                                    ].map(({ id, label, icon: Icon }) => (
                                        <button
                                            key={id}
                                            onClick={() => setActiveTab(id)}
                                            className={cn(
                                                "flex items-center gap-2 px-4 py-2 rounded-md text-sm font-medium transition-all",
                                                activeTab === id 
                                                    ? "bg-white/20 text-white shadow-sm" 
                                                    : "text-slate-300 hover:text-white hover:bg-white/10"
                                            )}
                                        >
                                            <Icon />
                                            <span className="hidden sm:inline">{label}</span>
                                        </button>
                                    ))}
                                </div>
                            </div>
                            <div className="container mx-auto px-4 py-8">
                                {renderTabContent()}
                            </div>
                        </div>
                    )}

                    {/* Floating Chat Button */}
                    <button
                        onClick={() => setChatbotOpen(true)}
                        className="fixed bottom-6 right-6 w-14 h-14 bg-blue-600 hover:bg-blue-700 text-white rounded-full shadow-lg hover:shadow-xl transition-all duration-300 flex items-center justify-center z-50"
                        aria-label="Open Watson Assistant Chat"
                    >
                        <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
                        </svg>
                    </button>

                    {/* Chatbot Modal */}
                    {chatbotOpen && (
                        <div className="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md h-96 flex flex-col">
                                {/* Header */}
                                <div className="flex items-center justify-between p-4 border-b bg-blue-600 text-white rounded-t-2xl">
                                    <div className="flex items-center gap-3">
                                        <div className="w-8 h-8 bg-white/20 rounded-full flex items-center justify-center">
                                            🤖
                                        </div>
                                        <div>
                                            <h3 className="font-semibold">Watson Assistant</h3>
                                            <p className="text-xs text-blue-100">Weather AI Helper</p>
                                        </div>
                                    </div>
                                    <button
                                        onClick={() => setChatbotOpen(false)}
                                        className="w-8 h-8 rounded-full hover:bg-white/20 flex items-center justify-center transition-colors"
                                    >
                                        ✕
                                    </button>
                                </div>

                                {/* Messages Area */}
                                <div className="flex-1 overflow-y-auto p-4 space-y-3">
                                    {chatMessages.length === 0 && (
                                        <div className="text-center text-gray-500 mt-8">
                                            <p>👋 Hello! I'm your Watson weather assistant.</p>
                                            <p className="text-sm mt-2">Ask me about weather, forecasts, or data analysis!</p>
                                        </div>
                                    )}
                                    
                                    {chatMessages.map((message, index) => (
                                        <div
                                            key={index}
                                            className={cn(
                                                "flex",
                                                message.sender === 'user' ? "justify-end" : "justify-start"
                                            )}
                                        >
                                            <div
                                                className={cn(
                                                    "inline-block max-w-[80%] p-3 rounded-2xl",
                                                    message.sender === 'user' 
                                                        ? "bg-blue-600 text-white" 
                                                        : message.sender === 'error'
                                                        ? "bg-red-100 text-red-800"
                                                        : "bg-gray-100 text-gray-800"
                                                )}
                                            >
                                                {message.text}
                                            </div>
                                        </div>
                                    ))}
                                    
                                    {chatLoading && (
                                        <div className="flex justify-start">
                                            <div className="inline-block bg-gray-100 text-gray-800 p-3 rounded-2xl">
                                                <div className="flex items-center gap-2">
                                                    <div className="w-2 h-2 bg-gray-400 rounded-full animate-bounce"></div>
                                                    <div className="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style={{animationDelay: '0.1s'}}></div>
                                                    <div className="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style={{animationDelay: '0.2s'}}></div>
                                                </div>
                                            </div>
                                        </div>
                                    )}
                                </div>

                                {/* Input Area */}
                                <div className="p-4 border-t">
                                    {!chatbotConfig?.initialized && (
                                        <div className="mb-3 p-2 bg-yellow-50 border border-yellow-200 rounded-lg text-sm text-yellow-800">
                                            ⚠️ Watson Assistant not configured. Please check API settings.
                                        </div>
                                    )}
                                    <div className="flex gap-2">
                                        <input
                                            type="text"
                                            value={chatInput}
                                            onChange={(e) => setChatInput(e.target.value)}
                                            onKeyPress={handleChatKeyPress}
                                            placeholder="Type your message..."
                                            className="flex-1 px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-900"
                                            disabled={chatLoading || !chatbotConfig?.initialized}
                                        />
                                        <button
                                            onClick={sendChatMessage}
                                            disabled={chatLoading || !chatInput.trim() || !chatbotConfig?.initialized}
                                            className="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
                                        >
                                            ↑
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                    </div>
                </div>
            );
        };

        // Render the app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    

</body>
</html>
