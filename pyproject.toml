[project]
name = "weather-dashboard"
version = "1.0.0"
description = "Weather Dashboard - Comprehensive weather analysis and forecasting platform with ML models and IBM Watson Assistant"
authors = [{name = "Weather Dashboard Team"}]
readme = "README.md"
requires-python = ">=3.11"
keywords = ["weather", "dashboard", "machine-learning", "forecasting", "watson-assistant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    # Core Flask Framework
    "flask>=3.1.1",
    "werkzeug>=3.1.3",
    "gunicorn>=23.0.0",
    # Data Science & ML
    "pandas>=2.3.0",
    "numpy>=2.3.0",
    "scikit-learn>=1.7.0",
    "joblib>=1.5.1",
    # Data Visualization
    "plotly>=6.1.2",
    # APIs & HTTP
    "requests>=2.32.3",
    "python-dotenv>=1.1.0",
    # IBM Watson Assistant
    "ibm-watson>=10.0.0",
    "ibm-cloud-sdk-core>=3.24.2",
]

[project.urls]
Repository = "https://github.com/weather-dashboard/weather-dashboard"
Documentation = "https://github.com/weather-dashboard/weather-dashboard/blob/main/replit.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["utils"]
